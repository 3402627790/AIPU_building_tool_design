[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unary: Unary element-wise ops (Abs, Neg, Sqrt, etc.)
    binary: Binary element-wise ops (Add, Sub, Mul, Div, etc.)
    conv: Convolution ops (Conv2D, DepthwiseConv, TransposeConv2D)
    pool: Pooling ops
    norm: Normalization ops (BatchNorm, LayerNorm, RMSNorm)
    activation: Activation ops
    shape: Shape manipulation ops (Reshape, Transpose, Tile, etc.)
    reduce: Reduction ops (Reduce, ArgMinMax, Softmax)
    spatial: Spatial rearrangement ops (DepthToSpace, SpaceToDepth, etc.)
    sequence: Sequence ops (BasicLSTM, ReverseSequence)
    float_only: Tests that only apply to float dtypes
    slow: Slow tests
