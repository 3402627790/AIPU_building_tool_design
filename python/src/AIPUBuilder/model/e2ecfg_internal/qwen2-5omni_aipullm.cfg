[Common]
model_path = /project/ai/scratch01/Model_Resource/huggingface/qwen2_5Omni
output_dir = ./
# app = mmstarmetric(prompt="",post_process="true",dataset_path="/project/ai/scratch01/Dataset/MMStar/",images_num="200")
app = vlchat(prompt="Describe this image", image="/project/ai/scratch01/Dataset/MMStar/images/0.jpg",post_process="true")
# app = vlchat(prompt="where is the capital of China")
engine=opt
[vit]
;get float ir, then use opt quant, metric use aipu_binary_path's ir
option_config='image_width=[448],image_height=[448],using_3d=false'
# aipu_binary_path = /project/ai/scratch01/liwxu01/AIPU_building_tool_design/python/qwen2.5thinker_vision.txt
model_name=qwen2.5thinker_vision
seq_len = 1024
past_len=1024

[thinker_prefill]
;get float ir, then use opt quant,metric use aipu_binary_path's ir
model_name=qwen2.5thinker
# aipu_binary_path = /project/ai/scratch01/liwxu01/AIPU_building_tool_design/python/qwen2.5thinker.txt
option_config='use_cache=false,broadcast_matmul=true'
seq_len = 1024
past_len=0
[thinker_decode]
;get float ir, then use opt quant,metric use aipu_binary_path's ir
model_name=qwen2.5thinker
option_config='use_cache=true,broadcast_matmul=true'
seq_len = 1
past_len=1023


[audio]
;get float ir, then use opt quant, metric use aipu_binary_path's ir
# option_config='image_width=[448],image_height=[448],using_3d=false'
model_name=qwen2.5thinker_audio
seq_len = 1024
past_len=1024
[dit]
;get float ir, then use opt quant, metric use aipu_binary_path's ir
;option_config='image_width=[314],image_height=[281],using_3d=false'
model_name=qwen2.5token2wave_dit
