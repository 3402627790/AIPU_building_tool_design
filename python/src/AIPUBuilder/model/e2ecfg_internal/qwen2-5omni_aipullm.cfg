[Common]
model_path = /project/ai/scratch01/Model_Resource/huggingface/qwen2_5Omni
output_dir = ./
app = mmstarmetric(prompt="",post_process="true",dataset_path="/project/ai/scratch01/Dataset/MMStar",images_num="200")
;app = vlchat(prompt="Describe this image", image="/project/ai/scratch03/liwxu01/MMStar/images/0.jpg",post_process="true")
;app = vlchat(prompt="where is the capital of China")
engine=opt

[vit]
;get float ir, then use opt quant, metric use aipu_binary_path's ir
;option_config='image_width=[314],image_height=[281],using_3d=false'
;quant_type=w4
option_config='image_width=[448],image_height=[336],using_3d=false'
;# aipu_binary_path = /project/ai/scratch01/liwxu01/AIPU_building_tool_design/python/qwen2.5thinker_vision_w4.txt
aipu_binary_path = /project/ai/scratch03/liwxu01/Qwen2.5-Omni/ir/qwen2.5thinker_vision_o.txt
model_name = qwen2.5thinker_vision
;quantization_config="weight_block_size=128"
// quantization_config='is_perf_mode=false'


[llm]
;get float ir, then use opt quant,metric use aipu_binary_path's ir
;quant_type=w4
model_name = qwen2.5thinker
aipu_binary_path = /project/ai/scratch03/liwxu01/Qwen2.5-Omni/ir/qwen2.5thinker_o.txt
;quantization_config="weight_block_size=128"
;quantization_config='is_perf_mode=false'
past_len=512
seq_len=512
