past_len=1024
[talker_prefill]
;get float ir, then use opt quant,metric use aipu_binary_path's ir
model_name=qwen2.5talker
option_config='use_cache=false,broadcast_matmul=true'
seq_len = 1024
past_len=0
[talker_decode]
;get float ir, then use opt quant,metric use aipu_binary_path's ir
model_name=qwen2.5talker
option_config='use_cache=true,broadcast_matmul=true'
