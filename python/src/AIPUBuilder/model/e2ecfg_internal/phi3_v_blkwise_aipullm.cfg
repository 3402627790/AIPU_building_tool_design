output_dir = ./
model_name = phi3_v
quant_type = w4
target = X3P_1304
vocab_json_path = /project/ai/zhouyi_compass/Model_Resource/huggingface/clip/clip-vit-large-patch14-336/vocab.json

[clip]
model_path = clip/clip-vit-large-patch14-336
