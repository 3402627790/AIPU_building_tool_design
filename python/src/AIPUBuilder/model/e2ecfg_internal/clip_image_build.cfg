[Common]
mode = build

[Model_cards]
model_path = timm/resnet50x4_clip.openai
config_name = open_clip_config.json
output_dir = ./
model_name = image_encoder
only_fp_ir = true

[Optimizer]
quantize_method_for_weight = per_channel_symmetric_restricted_range

cast_dtypes_for_lib = True
quantize_method_for_activation = per_tensor_asymmetric

calibration_data = /project/ai/zhouyi_compass/Model_Resource/huggingface/timm/resnet50x4_clip.openai/dataset/calibration_data20.npy
data = /project/ai/zhouyi_compass/Model_Resource/huggingface/timm/resnet50x4_clip.openai/dataset/dataset100.npy
label = /project/ai/zhouyi_compass/Model_Resource/huggingface/timm/resnet50x4_clip.openai/dataset/label100.npy
metric = CosDistanceMetric
calibration_batch_size = 1
metric_batch_size = 1
output_dir = ./
dataset = NumpyDataset
calibration_strategy_for_activation = extrema

quant_type = disable &<[(0,11),(54,67),(97,170)]:fp16>
min_compatible_zhouyi_target = X3



[GBuilder]
target = X3S_1304
