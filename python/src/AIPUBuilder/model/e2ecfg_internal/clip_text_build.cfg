[Common]
mode = build

[Model_cards]
model_path = timm/resnet50x4_clip.openai
config_name = open_clip_config.json
output_dir = ./
model_name = text_encoder
only_fp_ir = true

[Optimizer]

cast_dtypes_for_lib = True
quantize_method_for_weight = per_channel_symmetric_restricted_range & <[FullyConnected]:per_channel_asymmetric>

output_dir = ./

quant_type = fp16 & <[FullyConnected]:w4>
min_compatible_zhouyi_target = X3



[GBuilder]
target = X3S_1304
