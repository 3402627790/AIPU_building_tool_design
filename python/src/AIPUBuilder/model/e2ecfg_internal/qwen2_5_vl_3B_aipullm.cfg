[Common]
// model_path = Qwen/Qwen2.5-VL-3B-Instruct-AWQ
model_path = Qwen/Qwen2.5-VL-3B-Instruct
output_dir = ./
quant_type=w4
target=X3P_1304
// enable_gsim = true

[vit]
option_config='using_3d=false,depth=1,image_width=[392],image_height=[392]'
model_name = qwen2_5_vl_vision


[llm_prefill]
model_name = qwen2_5_vl_llm
seq_len=2048
past_len = 0
option_config="use_cache=false,num_hidden_layers=1,with_lm=false"

[llm_decoder]
model_name = qwen2_5_vl_llm
seq_len=1
past_len = 2047
option_config="num_hidden_layers=1,with_lm=false"

//huggingface website:https://huggingface.co/Qwen/Qwen2.5-VL-3B-Instruct