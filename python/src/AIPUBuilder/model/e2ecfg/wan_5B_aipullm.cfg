[Common]
app = wanti2v(img="img.png", positive_prompt="白天，晴天光，日光从高处洒下，硬光，侧光，暖色调，中景，中心构图，低角度拍摄。身上工牌写有'ARM CHINA'的CEO身着深色西装、白色衬衫与深蓝领带，神情庄重自信，站在纽约证券交易所铜钟前，右手持小锤大力敲钟。他身后整齐站立着十余名公司核心团队成员，均着正装，面带微笑。背景可见交易所标志性立柱与悬挂的多国国旗，人群中有轻微晃动的手臂与飘动的领带，远处天空为湛蓝色，无过度曝光。", negative_prompt="色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走", step="10", guidance_scale="5.0", seed="0")
tokenizer_path = /project/ai/scratch01/Model_Resource/huggingface/Wan-AI/Wan2.2-TI2V-5B-Diffusers/tokenizer
option_config="scheduler_path = /project/ai/scratch01/Model_Resource/huggingface/Wan-AI/Wan2.2-TI2V-5B-Diffusers/scheduler/scheduler_config.json, num_inference_steps=10"
output_dir = ./
quant_type = bf16
model_path = /project/ai/scratch01/Model_Resource/huggingface/Wan-AI/Wan2.2-TI2V-5B-Diffusers/text_encoder
model_name = umt5
engine = opt
serialize_fp_ir = false
enable_gsim = false
builder_config = '--enable_ds=false'

[embedding]
model_name = umt5_embedding

[prefill]
option_config = "use_cache=false, with_lm=false"
seq_len=512
past_len=0

[wantransformer3d]
model_path = /project/ai/scratch01/Model_Resource/huggingface/Wan-AI/Wan2.2-TI2V-5B-Diffusers/transformer
model_name = wantransformer3d

[wantransformer3d_time_embedding]
model_name = wantransformer3d_time_embedding
model_path = /project/ai/scratch01/Model_Resource/huggingface/Wan-AI/Wan2.2-TI2V-5B-Diffusers/transformer

[autoencoderkl_wan_encoder]
model_path = /project/ai/scratch01/Model_Resource/huggingface/Wan-AI/Wan2.2-TI2V-5B-Diffusers/vae
model_name = autoencoderkl_wan_encoder

[autoencoderkl_wan_decoder]
model_path = /project/ai/scratch01/Model_Resource/huggingface/Wan-AI/Wan2.2-TI2V-5B-Diffusers/vae
model_name = autoencoderkl_wan_decoder
