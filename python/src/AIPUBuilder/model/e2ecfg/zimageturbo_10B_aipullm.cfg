[Common]
app = zimaget2i(prompt="Cartoon yellow and white dog in front of a beautiful city skyline, holding a paper with '周易X3'", img_size = "512", seed=1)
tokenizer_path = /project/ai/scratch01/kejqia01/Z-Image-Turbo/tokenizer
output_dir = ./
quant_type = w4
model_path = /project/ai/scratch01/kejqia01/Z-Image-Turbo/text_encoder
model_name = qwen3
engine = opt
serialize_fp_ir = false

[embedding]
model_name = qwen3_embedding
# aipu_binary_path = /project/ai/scratch01/kejqia01/Z-Image-Turbo/IR/qwen3_embedding_w4.txt

[prefill]
option_config = "use_cache=false, with_lm=false"
seq_len=64
past_len=0
# aipu_binary_path = /project/ai/scratch01/kejqia01/Z-Image-Turbo/IR/qwen3_w4.txt

[zimagetransformer]
model_path = /project/ai/scratch01/kejqia01/Z-Image-Turbo/transformer
model_name = zimagetransformer
quant_type = w4
option_config = "latent_size = 32"
engine = opt
# aipu_binary_path = /project/ai/scratch01/kejqia01/Z-Image-Turbo/IR/zimagetransformer_w4.txt

[autoencoderkl]
model_path = /project/ai/scratch01/kejqia01/Z-Image-Turbo/vae
model_name = autoencoderkl
quant_type = fp16
option_config = "img_sample_size = 512"
engine = opt
# aipu_binary_path = /project/ai/scratch01/kejqia01/Z-Image-Turbo/IR/autoencoderkl_fp16.txt
